<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2. Bundesliga 2026/27 – Rasenschach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>2. Bundesliga 2026/27</h1>
    <div id="adminPanel">
      <button id="adminToggle">🔐 Admin-Modus</button>
      <span id="adminStatus">(Beobachter)</span>
    </div>
  </header>

  <p id="ladeStatus" class="lade-status"></p>

  <main>
    <section id="controls">
      <label for="spieltagSelect">Spieltag:</label>
      <select id="spieltagSelect"></select>
      <button id="refreshButton">🔄 Aktualisieren</button>
    </section>

    <section id="spieleContainer">
      <h2>Spiele des Spieltags</h2>
      <div id="spieleListe"></div>
    </section>

    <section id="tabelleContainer">
      <h2>Tabelle</h2>
      <div id="tabelle"></div>
    </section>

    <section id="figurenContainer">
      <h2>Figuren-Leaderboard</h2>
      <p class="figuren-hint">Wer holt saisonweit mit welcher Figur die meisten Punkte?</p>
      <div id="figurenLeaderboard" class="figuren-grid"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
