<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Bundesliga 2026/27 – Rasenschach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        #adminPanel {
            margin-top: 15px;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: #2a5298;
            color: white;
            border: 2px solid white;
        }

        .btn-primary:hover {
            background: white;
            color: #2a5298;
        }

        main {
            padding: 30px 20px;
        }

        #controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            flex-wrap: wrap;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }

        #controls label {
            font-weight: bold;
            color: #1e3c72;
        }

        #controls select {
            padding: 8px 15px;
            border: 2px solid #2a5298;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #2a5298;
            padding-bottom: 10px;
        }

        .spiele-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .spiel-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .spiel-card:hover {
            border-color: #2a5298;
            box-shadow: 0 5px 20px rgba(42, 82, 152, 0.3);
            transform: translateY(-5px);
        }

        .spiel-card.open {
            border-color: #2a5298;
            background: #f0f5ff;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .team-name {
            flex: 1;
            font-weight: bold;
            color: #333;
        }

        .team-heim {
            text-align: left;
            color: #2a5298;
        }

        .team-auswaerts {
            text-align: right;
            color: #666;
        }

        .match-score {
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #1e3c72;
            min-width: 80px;
        }

        .match-score.no-result {
            color: #999;
        }

        .brett-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0;
            aspect-ratio: 1;
            background: #999;
            border: 3px solid #333;
            margin-bottom: 15px;
            max-width: 300px;
        }

        .square {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            position: relative;
        }

        .square.light {
            background: #f0d9b5;
        }

        .square.dark {
            background: #b58863;
        }

        .piece {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }

        .theses {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            border-left: 4px solid #2a5298;
        }

        .thesis {
            font-size: 0.85em;
            color: #555;
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .thesis:last-child {
            border-bottom: none;
        }

        .tabelle-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #1e3c72;
            color: white;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
            white-space: nowrap;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f5f5f5;
        }

        tr.head-team td:first-child {
            font-weight: bold;
            color: #2a5298;
        }

        .figuren-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .figur-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .figur-name {
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .figur-leaderboard {
            margin-top: 10px;
        }

        .figur-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .figur-entry:last-child {
            border-bottom: none;
        }

        .figur-rank {
            color: #2a5298;
            font-weight: bold;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }

        .figuren-hint {
            color: #666;
            font-style: italic;
            margin-bottom: 20px;
        }

        .admin-status {
            background: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-left: 15px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            #controls {
                flex-direction: column;
                align-items: stretch;
            }

            #controls select {
                width: 100%;
            }

            .spiele-grid {
                grid-template-columns: 1fr;
            }

            .chess-board {
                max-width: 100%;
            }

            th, td {
                padding: 8px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ 2. Bundesliga 2026/27 – Rasenschach</h1>
            <div id="adminPanel">
                <button class="btn btn-primary" id="adminToggle">🔐 Admin-Modus</button>
                <span class="admin-status" id="adminStatus">(Beobachter)</span>
            </div>
        </header>

        <main>
            <section id="controls">
                <label for="spieltagSelect">Spieltag:</label>
                <select id="spieltagSelect"></select>
                <button class="btn btn-primary" id="refreshButton">🔄 Aktualisieren</button>
            </section>

            <section id="spieleContainer">
                <h2>Spiele des Spieltags</h2>
                <div id="spieleListe" class="spiele-grid"></div>
            </section>

            <section id="tabelleContainer">
                <h2>Tabelle</h2>
                <div id="tabelle" class="tabelle-container"></div>
            </section>

            <section id="figurenContainer">
                <h2>Figuren-Leaderboard</h2>
                <p class="figuren-hint">Wer holt saisonweit mit welcher Figur die meisten Punkte?</p>
                <div id="figurenLeaderboard" class="figuren-grid"></div>
            </section>
        </main>
    </div>

    <script>
        // GitHub API Configuration
        const GITHUB_OWNER = 'borntobeeasy';
        const GITHUB_REPO = 'RS-Tabelle';
        const GITHUB_BRANCH = 'main';
        const API_BASE = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;

        let spielplan = null;
        let alleSpiele = {};
        let currentSpielTag = 1;

        async function loadSpielplan() {
            try {
                const response = await fetch(`${API_BASE}/data/spielplan.json?ref=${GITHUB_BRANCH}`);
                const data = await response.json();
                const content = atob(data.content);
                spielplan = JSON.parse(content);
                initializeUI();
                await loadAllGames();
                updateDisplay();
            } catch (error) {
                console.error('Fehler beim Laden des Spielplans:', error);
                document.getElementById('spieleListe').innerHTML = '<div class="loading">Fehler beim Laden der Daten</div>';
            }
        }

        function initializeUI() {
            const select = document.getElementById('spieltagSelect');
            for (let i = 1; i <= spielplan.spieltage.length; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Spieltag ${i}`;
                select.appendChild(option);
            }
            select.addEventListener('change', (e) => {
                currentSpielTag = parseInt(e.target.value);
                updateDisplay();
            });
        }

        async function loadAllGames() {
            alleSpiele = {};
            for (let st = 1; st <= spielplan.spieltage.length; st++) {
                const spieltag = spielplan.spieltage[st - 1];
                for (const spiel of spieltag) {
                    const fileName = generateFileName(spiel.heim, spiel.auswaerts);
                    try {
                        const response = await fetch(`${API_BASE}/data/spieltag-${String(st).padStart(2, '0')}/${fileName}.json?ref=${GITHUB_BRANCH}`);
                        if (response.ok) {
                            const data = await response.json();
                            const content = atob(data.content);
                            alleSpiele[`${st}-${spiel.heim}-${spiel.auswaerts}`] = JSON.parse(content);
                        }
                    } catch (error) {
                        console.log(`Spiel nicht gefunden: ${fileName}`);
                    }
                }
            }
        }

        function generateFileName(heim, auswaerts) {
            const sanitize = (name) => name.toLowerCase()
                .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
                .replace(/[^a-z0-9]/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            return `${sanitize(heim)}-vs-${sanitize(auswaerts)}`;
        }

        function updateDisplay() {
            updateSpiele();
            updateTabelle();
            updateFiguren();
        }

        function updateSpiele() {
            const spieleListe = document.getElementById('spieleListe');
            const spieltag = spielplan.spieltage[currentSpielTag - 1];
            
            spieleListe.innerHTML = '';
            spieltag.forEach((spiel) => {
                const gameKey = `${currentSpielTag}-${spiel.heim}-${spiel.auswaerts}`;
                const gameData = alleSpiele[gameKey];
                
                const card = document.createElement('div');
                card.className = 'spiel-card' + (gameData ? ' open' : '');
                
                let scoreHtml = '';
                if (gameData) {
                    const whiteScore = Object.values(gameData.data.results.white).reduce((a, b) => a + b, 0);
                    const blackScore = Object.values(gameData.data.results.black).reduce((a, b) => a + b, 0);
                    scoreHtml = `<div class="match-score">${whiteScore} : ${blackScore}</div>`;
                } else {
                    scoreHtml = `<div class="match-score no-result">-:-</div>`;
                }
                
                let boardHtml = '';
                if (gameData) {
                    boardHtml = `
                        <div class="brett-container">
                            <div class="chess-board">
                                ${renderBoardHTML(gameData.data.positions)}
                            </div>
                            ${renderThesesHTML(gameData.data.theses)}
                        </div>
                    `;
                }
                
                card.innerHTML = `
                    <div class="match-header">
                        <div class="team-name team-heim">${spiel.heim}</div>
                        ${scoreHtml}
                        <div class="team-name team-auswaerts">${spiel.auswaerts}</div>
                    </div>
                    ${boardHtml}
                `;
                
                spieleListe.appendChild(card);
            });
        }

        function renderBoardHTML(positions) {
            let html = '';
            for (let row = 8; row >= 1; row--) {
                for (let col = 1; col <= 8; col++) {
                    const isLight = (row + col) % 2 === 0;
                    const squareClass = isLight ? 'light' : 'dark';
                    
                    const position = positions.find(p => p.id === (row - 1) * 8 + col);
                    let pieceHtml = '';
                    if (position && position.piece) {
                        const symbol = getPieceSymbol(position.piece, position.side);
                        pieceHtml = `<span class="piece">${symbol}</span>`;
                    }
                    
                    html += `<div class="square ${squareClass}">${pieceHtml}</div>`;
                }
            }
            return html;
        }

        function getPieceSymbol(piece, side) {
            const pieceMap = {
                'king': { white: '♔', black: '♚' },
                'queen': { white: '♕', black: '♛' },
                'rook': { white: '♖', black: '♜' },
                'bishop': { white: '♗', black: '♝' },
                'knight': { white: '♘', black: '♞' },
                'pawn': { white: '♙', black: '♟' }
            };
            return pieceMap[piece] ? pieceMap[piece][side] : '?';
        }

        function renderThesesHTML(theses) {
            const whiteTheses = theses.filter(t => t.team === 'white').slice(0, 5);
            const blackTheses = theses.filter(t => t.team === 'black').slice(0, 5);
            
            return `
                <div class="theses">
                    <strong style="color: #2a5298;">Weiß:</strong>
                    ${whiteTheses.map(t => `<div class="thesis">✓ ${t.text.substring(0, 50)}...</div>`).join('')}
                    <strong style="color: #666; margin-top: 10px; display: block;">Schwarz:</strong>
                    ${blackTheses.map(t => `<div class="thesis">✓ ${t.text.substring(0, 50)}...</div>`).join('')}
                </div>
            `;
        }

        function updateTabelle() {
            const tabelle = document.getElementById('tabelle');
            
            // Calculate standings
            const standings = {};
            spielplan.teams.forEach(team => {
                standings[team] = {
                    team: team,
                    spiele: 0,
                    siege: 0,
                    unentschieden: 0,
                    niederlagen: 0,
                    tore: 0,
                    gegentore: 0,
                    punkte: 0
                };
            });

            // Iterate through all played games up to current matchday
            for (let st = 1; st <= currentSpielTag; st++) {
                const spieltag = spielplan.spieltage[st - 1];
                spieltag.forEach((spiel) => {
                    const gameKey = `${st}-${spiel.heim}-${spiel.auswaerts}`;
                    const gameData = alleSpiele[gameKey];
                    
                    if (gameData) {
                        const heimScore = Object.values(gameData.data.results.white).reduce((a, b) => a + b, 0);
                        const auswScore = Object.values(gameData.data.results.black).reduce((a, b) => a + b, 0);
                        
                        standings[spiel.heim].spiele++;
                        standings[spiel.auswaerts].spiele++;
                        standings[spiel.heim].tore += heimScore;
                        standings[spiel.heim].gegentore += auswScore;
                        standings[spiel.auswaerts].tore += auswScore;
                        standings[spiel.auswaerts].gegentore += heimScore;
                        
                        if (heimScore > auswScore) {
                            standings[spiel.heim].siege++;
                            standings[spiel.heim].punkte += 3;
                            standings[spiel.auswaerts].niederlagen++;
                        } else if (heimScore < auswScore) {
                            standings[spiel.auswaerts].siege++;
                            standings[spiel.auswaerts].punkte += 3;
                            standings[spiel.heim].niederlagen++;
                        } else {
                            standings[spiel.heim].unentschieden++;
                            standings[spiel.auswaerts].unentschieden++;
                            standings[spiel.heim].punkte += 1;
                            standings[spiel.auswaerts].punkte += 1;
                        }
                    }
                });
            }

            // Sort standings
            const sorted = Object.values(standings).sort((a, b) => {
                if (b.punkte !== a.punkte) return b.punkte - a.punkte;
                return (b.tore - b.gegentore) - (a.tore - a.gegentore);
            });

            // Generate table HTML
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th style="width: 30px;">#</th>
                            <th>Team</th>
                            <th style="text-align: center;">S</th>
                            <th style="text-align: center;">U</th>
                            <th style="text-align: center;">N</th>
                            <th style="text-align: center;">Tore</th>
                            <th style="text-align: center;">Diff.</th>
                            <th style="text-align: center; font-weight: bold;">Punkte</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sorted.forEach((team, index) => {
                const diff = team.tore - team.gegentore;
                const diffClass = diff > 0 ? 'style="color: green;"' : diff < 0 ? 'style="color: red;"' : '';
                html += `
                    <tr class="head-team">
                        <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                        <td>${team.team}</td>
                        <td style="text-align: center;">${team.siege}</td>
                        <td style="text-align: center;">${team.unentschieden}</td>
                        <td style="text-align: center;">${team.niederlagen}</td>
                        <td style="text-align: center;">${team.tore}:${team.gegentore}</td>
                        <td style="text-align: center;" ${diffClass}>${diff > 0 ? '+' : ''}${diff}</td>
                        <td style="text-align: center; font-weight: bold; color: #2a5298;">${team.punkte}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tabelle.innerHTML = html;
        }

        function updateFiguren() {
            const figurenLeaderboard = document.getElementById('figurenLeaderboard');
            const figurenStats = {
                'king': [], 'queen': [], 'rook': [], 'bishop': [], 'knight': [], 'pawn': []
            };

            // Collect stats from all games
            Object.values(alleSpiele).forEach((game) => {
                game.data.results.white && Object.entries(game.data.results.white).forEach(([fig, count]) => {
                    if (figurenStats[fig]) {
                        figurenStats[fig].push({ team: game.data.names.white, punkte: count });
                    }
                });
                game.data.results.black && Object.entries(game.data.results.black).forEach(([fig, count]) => {
                    if (figurenStats[fig]) {
                        figurenStats[fig].push({ team: game.data.names.black, punkte: count });
                    }
                });
            });

            // Render figure cards
            figurenLeaderboard.innerHTML = '';
            Object.entries(figurenStats).forEach(([figName, data]) => {
                const sorted = data.sort((a, b) => b.punkte - a.punkte).slice(0, 5);
                const card = document.createElement('div');
                card.className = 'figur-card';
                card.innerHTML = `
                    <div class="figur-name">${getPieceSymbol(figName, 'white')} ${figName.toUpperCase()}</div>
                    <div class="figur-leaderboard">
                        ${sorted.map((entry, idx) => `
                            <div class="figur-entry">
                                <span class="figur-rank">#${idx + 1}</span>
                                <span>${entry.team}</span>
                                <span style="color: #2a5298; font-weight: bold;">${entry.punkte}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                figurenLeaderboard.appendChild(card);
            });
        }

        document.getElementById('refreshButton').addEventListener('click', async () => {
            document.getElementById('spieleListe').innerHTML = '<div class="loading">Aktualisiere...</div>';
            await loadAllGames();
            updateDisplay();
        });

        document.getElementById('adminToggle').addEventListener('click', () => {
            alert('Admin-Modus ist für diese Version deaktiviert. Änderungen nur via GitHub möglich.');
        });

        // Initialize on load
        loadSpielplan();
    </script>
</body>
</html>
