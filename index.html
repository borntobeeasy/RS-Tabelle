<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2. Bundesliga · Rasenschach 26/27</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       TOKENS – angelehnt an bundesliga.com
       ============================================================ */
    :root {
      --bl-red: #E30613;
      --bl-red-dark: #b00510;
      --bl-gold: #FFD700;
      --bl-white: #FFFFFF;
      --bl-black: #0A0C0E;
      --bl-dark: #14181C;
      --bl-gray: #1A2026;
      --bl-gray-light: #2A3138;
      --bl-steel: #8899AA;
      --bl-steel-light: #B0C0D0;
      --bl-line: rgba(255,255,255,0.08);
      --bl-line-strong: rgba(255,255,255,0.15);
      --bl-shadow: 0 8px 32px rgba(0,0,0,0.5);
      --bl-shadow-soft: 0 4px 20px rgba(0,0,0,0.25);
      --bl-radius: 16px;
      --cell-size: clamp(56px, min(6.5vw, 14vh), 100px);
      --font-headline: 'Anton', 'Arial Narrow', Impact, sans-serif;
      --font-text: 'Inter', 'Sora', 'Segoe UI', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      --transition: 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: var(--bl-red); color: var(--bl-white); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bl-black);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(227,6,19,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(227,6,19,0.03) 0%, transparent 40%);
      color: var(--bl-white);
      font-family: var(--font-text);
      font-weight: 400;
      line-height: 1.5;
      padding: 0;
    }

    /* ============================================================
       TOPBAR – wie bundesliga.com (nur Logo)
       ============================================================ */
    .bl-topbar {
      background: var(--bl-dark);
      border-bottom: 1px solid var(--bl-line);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .bl-topbar .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bl-topbar .brand .logo-img {
      height: 36px;
      width: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
    .bl-topbar .nav-links {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .bl-topbar .nav-links button {
      padding: 6px 16px;
      border: none;
      background: transparent;
      color: var(--bl-steel);
      font-family: var(--font-text);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color var(--transition), border-bottom var(--transition);
      border-bottom: 2px solid transparent;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bl-topbar .nav-links button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bl-topbar .nav-links button:hover {
      color: var(--bl-white);
      border-bottom-color: var(--bl-red);
    }
    .bl-topbar .nav-links button.active {
      color: var(--bl-white);
      border-bottom-color: var(--bl-red);
    }

    /* ============================================================
       HERO – reduziert, wie bundesliga.com
       ============================================================ */
    .bl-hero {
      position: relative;
      padding: 32px 32px 24px;
      margin-bottom: 20px;
      background: var(--bl-black);
      border-bottom: 1px solid var(--bl-line);
    }
    .bl-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1600&q=80') center/cover no-repeat;
      opacity: 0.12;
      filter: brightness(0.5) saturate(0.6);
      z-index: 0;
    }
    .bl-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(0,0,0,0.3) 0%, rgba(10,12,14,0.8) 80%);
      z-index: 1;
    }
    .bl-hero .hero-inner {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .bl-hero .hero-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .bl-hero .hero-left .league-name {
      font-family: var(--font-headline);
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--bl-white);
      line-height: 1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }
    .bl-hero .hero-left .league-name .gold { color: var(--bl-gold); }
    .bl-hero .hero-left .sub {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bl-steel-light);
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .bl-hero .hero-left .sub strong { color: var(--bl-gold); }
    .bl-hero .hero-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      padding: 10px 20px;
      border-radius: var(--bl-radius);
      border: 1px solid var(--bl-line);
    }
    .bl-hero .hero-right .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bl-hero .hero-right .stat-item .num {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--bl-white);
    }
    .bl-hero .hero-right .stat-item .label {
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bl-steel);
    }
    .bl-hero .hero-right .divider {
      width: 1px;
      height: 28px;
      background: var(--bl-line);
    }

    /* ============================================================
       APP SHELL
       ============================================================ */
    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    /* ============================================================
       VIEWS
       ============================================================ */
    .view {
      display: none;
      animation: fadeUp 0.25s ease;
    }
    .view.active {
      display: block;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       LAYOUT: Tabelle links, Spiele rechts
       ============================================================ */
    .content-wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .content-wrapper .left-col {
      flex: 0 0 520px;
      min-width: 0;
      position: sticky;
      top: 80px;
    }
    .content-wrapper .right-col {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 1100px) {
      .content-wrapper {
        flex-direction: column;
      }
      .content-wrapper .left-col {
        flex: none;
        width: 100%;
        position: static;
      }
    }

    /* ============================================================
       TABELLE – wie bundesliga.com
       ============================================================ */
    .table-wrap {
      background: var(--bl-gray);
      border-radius: var(--bl-radius);
      overflow: hidden;
      box-shadow: var(--bl-shadow);
      border: 1px solid var(--bl-line);
    }
    .table-wrap .table-title {
      padding: 14px 20px;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--bl-steel);
      font-weight: 600;
      border-bottom: 1px solid var(--bl-line);
      background: var(--bl-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-wrap .table-title .badge {
      color: var(--bl-gold);
      font-weight: 700;
    }

    .liga-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }
    .liga-table th {
      text-align: left;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--bl-steel);
      border-bottom: 2px solid var(--bl-line-strong);
      font-family: var(--font-mono);
    }
    .liga-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--bl-line);
      vertical-align: middle;
      font-family: var(--font-mono);
      font-weight: 500;
    }
    .liga-table td.team {
      font-family: var(--font-text);
      font-weight: 600;
      color: var(--bl-white);
    }
    .liga-table tbody tr:hover td {
      background: rgba(227,6,19,0.04);
    }
    .liga-table .pos {
      font-weight: 800;
      color: var(--bl-steel);
      text-align: center;
      font-size: 0.7rem;
    }
    /* Top 3 – goldener Balken */
    .liga-table tbody tr:nth-child(-n+2) td:first-child {
      border-left: 4px solid var(--bl-gold);
      background: rgba(255,215,0,0.05);
    }
    .liga-table tbody tr:nth-child(-n+2) .pos {
      color: var(--bl-black);
      background: var(--bl-gold);
      padding: 2px 0;
      border-radius: 4px;
      font-weight: 900;
    }
    /* Abstiegsplätze – roter Balken */
    .liga-table tbody tr:nth-last-child(-n+2) td:first-child {
      border-left: 4px solid var(--bl-red);
      background: rgba(227,6,19,0.05);
    }
    .liga-table tbody tr:nth-last-child(-n+2) .pos {
      color: var(--bl-white);
      background: var(--bl-red);
      padding: 2px 0;
      border-radius: 4px;
    }
    .liga-table .pts {
      font-weight: 800;
      font-size: 1rem;
      color: var(--bl-white);
      text-align: center;
    }
    .liga-table .num {
      text-align: center;
      color: var(--bl-steel);
    }

    /* ============================================================
       SPIELTAG-TABS – wie bundesliga.com
       ============================================================ */
    .liga-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 20px;
      padding: 4px;
      background: var(--bl-dark);
      border-radius: var(--bl-radius);
      border: 1px solid var(--bl-line);
    }
    .liga-tabs button {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--bl-steel);
      font-weight: 600;
      font-size: 0.65rem;
      font-family: var(--font-text);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all var(--transition);
      border-radius: 8px;
    }
    .liga-tabs button:hover {
      background: rgba(255,255,255,0.04);
      color: var(--bl-white);
    }
    .liga-tabs button.active {
      background: var(--bl-red);
      color: var(--bl-white);
      box-shadow: 0 4px 12px rgba(227,6,19,0.2);
    }

    /* ============================================================
       SPIELKARTEN – wie bundesliga.com Live-Spielcenter
       ============================================================ */
    .spiel-liste {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .spiel-item {
      background: var(--bl-gray);
      border-radius: var(--bl-radius);
      box-shadow: var(--bl-shadow-soft);
      border: 1px solid var(--bl-line);
      transition: transform var(--transition), box-shadow var(--transition);
      overflow: hidden;
    }
    .spiel-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--bl-shadow);
    }
    .spiel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--bl-dark);
      border-bottom: 1px solid var(--bl-line);
    }
    .spiel-header .team-block {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .spiel-header .team-block.heim { justify-content: flex-start; }
    .spiel-header .team-block.auswaerts { justify-content: flex-end; }
    .spiel-header .team-logo-small {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
    .spiel-header .team-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--bl-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spiel-header .score-display {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 800;
      background: var(--bl-black);
      border: 2px solid var(--bl-red);
      padding: 4px 16px;
      border-radius: 8px;
      color: var(--bl-white);
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 72px;
      text-align: center;
    }
    .spiel-header .toggle-btn {
      background: transparent;
      border: 1px solid var(--bl-line-strong);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      color: var(--bl-white);
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform var(--transition), background var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .spiel-header .toggle-btn:hover {
      background: rgba(227,6,19,0.15);
      border-color: var(--bl-red);
    }
    .spiel-header .toggle-btn.open {
      transform: rotate(180deg);
      background: rgba(227,6,19,0.2);
      border-color: var(--bl-red);
    }
    .spiel-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 20px;
      font-size: 0.55rem;
      font-family: var(--font-mono);
      color: var(--bl-steel);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--bl-gray-light);
      border-bottom: 1px solid var(--bl-line);
    }
    .spiel-meta .status {
      font-weight: 700;
      color: var(--bl-gold);
    }
    .spiel-meta .status.done { color: #00b050; }

    /* Brettcontainer – zentriert */
    .spiel-board-container {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.3s ease, opacity 0.25s ease, padding 0.3s ease;
      background: var(--bl-black);
    }
    .spiel-board-container>* { overflow: hidden; }
    .spiel-board-container.open {
      grid-template-rows: 1fr;
      opacity: 1;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    /* ============================================================
       BRETT – wie bundesliga.com Taktik-Tafel
       ============================================================ */
    .board-panel {
      background: var(--bl-gray);
      border-radius: var(--bl-radius);
      padding: 16px;
      box-shadow: inset 0 0 0 1px var(--bl-line);
      max-width: fit-content;
      margin: 0 auto;
      width: 100%;
    }
    .board-panel .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .board-panel .topbar .eyebrow {
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--bl-steel);
    }
    .board-panel .topbar h3 {
      font-family: var(--font-headline);
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--bl-white);
      margin: 0;
    }
    .board-panel .scoreboard {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    .board-panel .scoreboard>div {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--bl-black);
      padding: 8px 20px;
      border-radius: var(--bl-radius);
      border: 1px solid var(--bl-line-strong);
    }
    .board-panel .team-logo-wrapper {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .board-panel .team-logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }
    .board-panel .scoreboard .score-box {
      font-family: var(--font-headline);
      background: var(--bl-red);
      padding: 4px 16px;
      border-radius: 8px;
      color: white;
      font-size: 1.3rem;
      font-weight: 400;
    }
    .board-panel .chess-grid {
      display: grid;
      grid-template-columns: repeat(5, var(--cell-size));
      grid-template-rows: repeat(4, var(--cell-size));
      margin: 0 auto;
      border: 2px solid var(--bl-red);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--bl-line), var(--bl-shadow);
      background: var(--bl-black);
      width: fit-content;
    }
    .board-panel .grid-cell {
      position: relative;
      background: var(--bl-gray);
      border: 1px solid var(--bl-line);
    }
    .board-panel .piece-cell {
      display: grid;
      place-items: center;
      background: var(--bl-gray);
      color: var(--bl-white);
      font-weight: 800;
      position: relative;
    }
    .board-panel .piece-cell.light { background: var(--bl-gray-light); }
    .board-panel .piece-cell .field-watermark {
      position: absolute;
      right: 4px;
      bottom: 4px;
      font-family: var(--font-mono);
      font-size: clamp(0.5rem, calc(var(--cell-size)*0.12), 0.9rem);
      font-weight: 800;
      pointer-events: none;
      opacity: 0.7;
    }
    .board-panel .piece-cell .field-watermark.positive { color: #2be08a; }
    .board-panel .piece-cell .field-watermark.negative { color: #ff4d4d; }
    .board-panel .piece-cell .field-watermark.zero { color: #c3aeff; }
    .board-panel .piece-cell .piece-svg {
      width: 55%;
      max-width: 44px;
      height: auto;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
      opacity: 0.9;
    }
    .board-panel .piece-cell:not(.light) .piece-svg {
      filter: invert(1) drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }
    .board-panel .piece-cell .player-photo {
      position: absolute;
      inset: 4px;
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      object-fit: contain;
      object-position: center bottom;
      padding: 2px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }
    .board-panel .piece-cell .piece-corner {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22%;
      max-width: 20px;
      background: rgba(0,0,0,0.5);
      padding: 2px;
      border-radius: 4px;
    }
    .board-panel .piece-cell.has-player-image .piece-svg { display: none; }
    .board-panel .drop-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bl-black);
    }
    .board-panel .drop-cell .drop-value {
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, calc(var(--cell-size)*0.16), 1.1rem);
      font-weight: 800;
      color: var(--bl-white);
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .board-panel .drop-cell.has-theses .drop-value {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: clamp(0.35rem, calc(var(--cell-size)*0.07), 0.55rem);
      color: var(--bl-steel);
    }
    .board-panel .drop-cell .drop-total {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, calc(var(--cell-size)*0.16), 1.1rem);
      font-weight: 800;
      color: var(--bl-steel);
      display: none;
    }
    .board-panel .drop-cell.has-theses .drop-total { display: block; }
    .board-panel .placed-list {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-auto-rows: 1fr;
      gap: 2px;
      padding: 2px;
      pointer-events: none;
      z-index: 2;
    }
    .board-panel .placed-chip {
      display: grid;
      place-items: center;
      background: var(--bl-white);
      color: var(--bl-black);
      font-size: clamp(0.2rem, 0.35vw, 0.4rem);
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      position: relative;
    }
    .board-panel .placed-chip .chip-field-badge {
      position: absolute;
      top: 2px;
      left: 4px;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 0.7em;
      color: rgba(0,0,0,0.4);
    }
    .board-panel .placed-chip .chip-watermark {
      position: absolute;
      right: 4px;
      bottom: 2px;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 1.1em;
    }
    .board-panel .placed-chip .chip-watermark.positive { color: #0f9d5c; }

<body>

  <!-- ============================================================
  APP

  <div class="app-shell" id="app">

    <!-- TABELLE + SPIELE (Hauptansicht) -->

              <thead><tr><th>#</th><th>Team</th><th class="num">Sp</th><th class="num">S</th><th class="num">U</th><th class="num">N</th><th class="num">Tore</th><th class="num">Diff</th><th class="pts">Pkt</th></tr></thead>

  <!-- ============================================================
  SCRIPT – unveränderte Logik
  ============================================================ -->
  <script>
    // ============================
    //  KONFIGURATION
    // ============================
    const SPIELPLAN_URL = 'spielplan.json';
    const DATA_BASE = 'data/';

    let spielplan = null;
    let teams = [];
    let allGameData = {};
    let currentView = 'table';
    let currentSpieltag = 0;

    // ============================
    //  PIECES
    // ============================
    const PIECES = [
      { id: 'rook', name: 'Turm' },
      { id: 'bishop', name: 'Läufer' },
      { id: 'knight', name: 'Springer' },
      { id: 'queen', name: 'Dame' },
      { id: 'king', name: 'König' },
    ];
    const PIECE_SVG_URLS = {
      rook: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
      bishop: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
      knight: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
      queen: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
      king: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
    };

    function formatNumber(num) { return num > 0 ? `+${num}` : String(num); }
    function getScoreTone(value) {
      if (value > 0) return 'positive';
      if (value < 0) return 'negative';
      return 'zero';
    }
    function getPieceById(id) { return PIECES.find(p => p.id === id); }

    function getAssignmentScore(assignment, state) {
      if (!assignment.side || !assignment.piece || !assignment.polarity) return 0;
      const piece = getPieceById(assignment.piece);
      if (!piece) return 0;
      const sign = assignment.polarity === 'positive' ? 1 : -1;
      const base = { rook: 3, bishop: 1, knight: 1, queen: 1, king: 3 } [assignment.piece] || 1;
      switch (assignment.piece) {
        case 'knight':
          const knightVal = state.questionValue ?? 1;
          return (assignment.polarity === 'positive') ? knightVal : 0;
        case 'bishop':
          return (assignment.polarity === 'positive') ? -base : 0;
        case 'queen':
          return (assignment.polarity === 'positive') ? base : 0;
        case 'rook':
          return base * sign * -1;
        default:
          return base * sign;
      }
    }

    function isGameComplete(state) {
      const placed = state.assignments.filter(a => a.side && a.piece).length;
      return placed >= 10;
    }

    function getGameScore(state) {
      let whiteTotal = 0,
        blackTotal = 0;
      PIECES.forEach(p => {
        whiteTotal += state.results.white[p.id] || 0;
        blackTotal += state.results.black[p.id] || 0;
      });
      state.assignments.forEach(a => {
        if (a.side === 'white') whiteTotal += getAssignmentScore(a, state);
        else if (a.side === 'black') blackTotal += getAssignmentScore(a, state);
      });
      return { white: whiteTotal, black: blackTotal };
    }

    // ============================
    //  TABELLE
    // ============================
    function buildTableData() {
      if (!spielplan || !teams.length) return [];
      const stats = {};
      teams.forEach(t => {
        stats[t] = { sp: 0, s: 0, u: 0, n: 0, tore: 0, gegentore: 0, punkte: 0 };
      });
      spielplan.spieltage.forEach((spieltag, stIdx) => {
        spieltag.forEach((spiel, spIdx) => {
          const key = `${stIdx}-${spIdx}`;
          const state = allGameData[key];
          if (!state) return;
          if (!isGameComplete(state)) return;
          const score = getGameScore(state);
          const home = spiel.heim,
            away = spiel.auswaerts;
          if (!home || !away) return;
          stats[home].sp++;
          stats[away].sp++;
          stats[home].tore += score.white;
          stats[home].gegentore += score.black;
          stats[away].tore += score.black;
          stats[away].gegentore += score.white;
          if (score.white > score.black) { stats[home].s++;
            stats[home].punkte += 3;
            stats[away].n++; } else if (score.black > score.white) { stats[away].s++;
            stats[away].punkte += 3;
            stats[home].n++; } else { stats[home].u++;
            stats[home].punkte += 1;
            stats[away].u++;
            stats[away].punkte += 1; }
        });
      });
      const sorted = teams.slice().sort((a, b) => {
        if (stats[b].punkte !== stats[a].punkte) return stats[b].punkte - stats[a].punkte;
        const diffA = stats[a].tore - stats[a].gegentore;
        const diffB = stats[b].tore - stats[b].gegentore;
        if (diffB !== diffA) return diffB - diffA;
        return stats[b].tore - stats[a].tore;
      });
      return sorted.map((team, idx) => ({
        pos: idx + 1,
        team,
        sp: stats[team].sp,
        s: stats[team].s,
        u: stats[team].u,
        n: stats[team].n,
        tore: stats[team].tore,
        gegentore: stats[team].gegentore,
        diff: stats[team].tore - stats[team].gegentore,
        punkte: stats[team].punkte
      }));
    }

    function renderTables() {
      const data = buildTableData();
      const tbody = document.getElementById('tableOnlyBody');
      tbody.innerHTML = '';
      data.forEach(row => {
        const diff = row.diff;
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td class="pos">${row.pos}</td><td class="team">${row.team}</td><td class="num">${row.sp}</td><td class="num">${row.s}</td><td class="num">${row.u}</td><td class="num">${row.n}</td><td class="num">${row.tore}:${row.gegentore}</td><td class="num">${diff>0?'+':''}${diff}</td><td class="pts">${row.punkte}</td>`;
        tbody.appendChild(tr);
      });
    }

    // ============================
    //  BRETT-RENDERER
    // ============================
    function renderBoard(container, stIdx, spIdx, homeTeam, awayTeam, state) {
      const board = document.createElement('div');
      board.className = 'board-panel';
      const topbar = document.createElement('div');
      topbar.className = 'topbar';
      topbar.innerHTML =
        `<div><span class="eyebrow">${homeTeam} vs ${awayTeam}</span><h3>Rasenschach · Spieltag ${stIdx+1}</h3></div>`;
      board.appendChild(topbar);

      const score = getGameScore(state);
      const whiteLogo = state.teamLogos?.white || null;
      const blackLogo = state.teamLogos?.black || null;
      const sb = document.createElement('div');
      sb.className = 'scoreboard';
      sb.innerHTML = `<div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="team-logo-wrapper">${whiteLogo ? `<img src="${whiteLogo}" alt="" />` : homeTeam[0]}</div>
            <span style="font-weight:700;color:var(--bl-white);font-size:0.95rem;font-family:var(--font-text);">${homeTeam}</span>
          </div>
          <div class="score-box">${score.white} : ${score.black}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-weight:700;color:var(--bl-white);font-size:0.95rem;font-family:var(--font-text);">${awayTeam}</span>
            <div class="team-logo-wrapper">${blackLogo ? `<img src="${blackLogo}" alt="" />` : awayTeam[0]}</div>
          </div>
        </div>`;
      board.appendChild(sb);

      const grid = document.createElement('div');
      grid.className = 'chess-grid';
      const rows = ['top', 'white', 'black', 'bottom'];
      rows.forEach(row => {
        PIECES.forEach((piece, idx) => {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          if (row === 'top' || row === 'bottom') {
            cell.classList.add('piece-cell');
            if ((row === 'top' && idx % 2 === 1) || (row === 'bottom' && idx % 2 === 0)) cell.classList.add(
            'light');
            const side = row === 'top' ? 'white' : 'black';
            const slot = `${row}-${piece.id}`;
            const image = state.figureImages?.[slot] || null;
            const scoreVal = state.results[side]?.[piece.id] ?? 0;
            const pieceSvg = PIECE_SVG_URLS[piece.id];
            let html = `<strong class="field-watermark ${getScoreTone(scoreVal)}">${formatNumber(scoreVal)}</strong>`;
            if (image) {
              cell.classList.add('has-player-image');
              html += `<img class="player-photo" src="${image}" alt="" />`;
              html += `<img class="piece-corner" src="${pieceSvg}" alt="" />`;
            } else {
              html += `<img class="piece-svg" src="${pieceSvg}" alt="" />`;
            }
            cell.innerHTML = html;
          } else {
            cell.classList.add('drop-cell');
            cell.dataset.side = row;
            cell.dataset.piece = piece.id;
            let thesisTotal = 0;
            state.assignments.forEach(a => {
              if (a.side === row && a.piece === piece.id) thesisTotal += getAssignmentScore(a, state);
            });
            let figureValue = (piece.id === 'knight' && state.questionValue !== null) ? formatNumber(state
              .questionValue) : piece.value;
            let html = `<div class="drop-value">${figureValue}</div>`;
            if (thesisTotal !== 0) { html += `<div class="drop-total">${formatNumber(thesisTotal)}</div>`;
              cell.classList.add('has-theses'); }
            html += `<div class="placed-list" data-slot="${row}-${piece.id}"></div>`;
            cell.innerHTML = html;
          }
          grid.appendChild(cell);
        });
      });
      board.appendChild(grid);
      container.innerHTML = '';
      container.appendChild(board);
      container.querySelectorAll('.placed-list').forEach(slot => slot.innerHTML = '');
      state.assignments.forEach(a => {
        if (!a.side || !a.piece) return;
        const slot = container.querySelector(`[data-slot="${a.side}-${a.piece}"]`);
        if (!slot) return;
        const piece = getPieceById(a.piece);
        const fieldLabel = (a.piece === 'knight' && state.questionValue !== null) ? formatNumber(state.questionValue) :
          piece.value;
        const score = getAssignmentScore(a, state);
        const chip = document.createElement('span');
        chip.className = 'placed-chip';
        chip.innerHTML =
          `<span class="chip-field-badge">${fieldLabel}</span><strong class="chip-watermark ${getScoreTone(score)}">${formatNumber(score)}</strong><span class="fit-text">${state.theses[a.id-1]}</span>`;
        slot.appendChild(chip);
      });
    }

    // ============================
    //  SPIEL-LISTE
    // ============================
    function createSpielItem(stIdx, spIdx, spiel, state) {
      const item = document.createElement('div');
      item.className = 'spiel-item';
      if (!state) {
        item.innerHTML =
          `<div class="spiel-header" style="opacity:0.4;cursor:default;"><span>${spiel.heim}</span><span>vs</span><span>${spiel.auswaerts}</span><span style="color:var(--bl-steel);font-size:0.55rem;">nicht verfügbar</span></div>`;
        return item;
      }
      const score = getGameScore(state);
      const placed = state.assignments.filter(a => a.side && a.piece).length;
      const complete = placed >= 10;
      const homeLogo = state.teamLogos?.white || null;
      const awayLogo = state.teamLogos?.black || null;
      const header = document.createElement('div');
      header.className = 'spiel-header';
      header.innerHTML = `
          <div class="team-block heim">${homeLogo ? `<img class="team-logo-small" src="${homeLogo}" alt="" />` : ''}<span class="team-name">${spiel.heim}</span></div>
          <span class="score-display">${score.white} : ${score.black}</span>
          <div class="team-block auswaerts"><span class="team-name">${spiel.auswaerts}</span>${awayLogo ? `<img class="team-logo-small" src="${awayLogo}" alt="" />` : ''}</div>
          <button class="toggle-btn" aria-label="Brett ein-/ausklappen">▼</button>
        `;
      item.appendChild(header);
      const meta = document.createElement('div');
      meta.className = 'spiel-meta';
      meta.innerHTML =
        `<span class="status ${complete ? 'done' : ''}">${complete ? '✓ gespielt' : '⏳ offen'}</span><span>${placed}/10 Figuren</span>`;
      item.appendChild(meta);
      const boardContainer = document.createElement('div');
      boardContainer.className = 'spiel-board-container';
      item.appendChild(boardContainer);
      const toggleBtn = header.querySelector('.toggle-btn');
      let isOpen = false;
      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isOpen = !isOpen;
        toggleBtn.classList.toggle('open', isOpen);
        boardContainer.classList.toggle('open', isOpen);
        if (isOpen && !boardContainer.hasChildNodes()) {
          renderBoard(boardContainer, stIdx, spIdx, spiel.heim, spiel.auswaerts, state);
        }
      });
      return item;
    }

    // ============================
    //  RENDER SPIELE FÜR HAUPTANSICHT
    // ============================
    function renderMainSpiele(spieltagIndex) {
      currentSpieltag = spieltagIndex;
      const container = document.getElementById('spieleContainer');
      container.innerHTML = '';
      const spiele = spielplan.spieltage[spieltagIndex];
      if (!spiele) { container.innerHTML =
          '<p style="color:var(--bl-steel);font-size:0.75rem;">Spieltag nicht gefunden.</p>'; return; }
      spiele.forEach((spiel, idx) => {
        const key = `${spieltagIndex}-${idx}`;
        const state = allGameData[key];
        const item = createSpielItem(spieltagIndex, idx, spiel, state);
        container.appendChild(item);
      });
      renderTabs(spieltagIndex + 1);
      document.getElementById('heroSpieltag').textContent = spieltagIndex + 1;
    }

    function computeTabNumbers(total, current) {
      if (total <= 5) return Array.from({ length: total }, (_, i) => i + 1);
      const raw = [1, current - 1, current, current + 1, total];
      const seen = new Set();
      const result = [];
      raw.forEach(n => { if (n >= 1 && n <= total && !seen.has(n)) { seen.add(n);
          result.push(n); } });
      result.sort((a, b) => a - b);
      return result;
    }

    function renderTabs(current) {
      const total = spielplan.spieltage.length;
      const tabsContainer = document.getElementById('spieltagTabs');
      tabsContainer.innerHTML = '';
      computeTabNumbers(total, current).forEach(n => {
        const btn = document.createElement('button');
        btn.textContent = `${n}. Spieltag`;
        btn.dataset.index = n - 1;
        btn.classList.toggle('active', n === current);
        btn.addEventListener('click', () => renderMainSpiele(n - 1));
        tabsContainer.appendChild(btn);
      });
    }

    // ============================
    //  ALLE SPIELE (Games-View)
    // ============================
    function renderAllGames() {
      const container = document.getElementById('allGamesContainer');
      container.innerHTML = '';
      spielplan.spieltage.forEach((spiele, stIdx) => {
        const group = document.createElement('div');
        group.className = 'spieltag-group';
        const headline = document.createElement('div');
        headline.className = 'spieltag-headline';
        headline.innerHTML =
          `Spieltag ${stIdx+1} <small>${spiele.length} Partien</small> <span class="badge-count">⚡</span>`;
        group.appendChild(headline);
        const list = document.createElement('div');
        list.className = 'spiel-liste';
        spiele.forEach((spiel, spIdx) => {
          const key = `${stIdx}-${spIdx}`;
          const state = allGameData[key];
          const item = createSpielItem(stIdx, spIdx, spiel, state);
          list.appendChild(item);
        });
        group.appendChild(list);
        container.appendChild(group);
      });
    }

    // ============================
    //  STATISTIKEN
    // ============================
    function computeAppearanceStats() {
      const players = {};
      for (const [key, state] of Object.entries(allGameData)) {
        if (!state) continue;
        if (!isGameComplete(state)) continue;
        const [stIdx, spIdx] = key.split('-').map(Number);
        const spiel = spielplan.spieltage[stIdx]?.[spIdx];
        if (!spiel) continue;
        const rows = ['top', 'bottom'];
        rows.forEach(row => {
          const side = row === 'top' ? 'white' : 'black';
          PIECES.forEach(piece => {
            const slot = `${row}-${piece.id}`;
            const image = state.figureImages?.[slot];
            if (!image) return;
            if (!players[image]) { players[image] = { count: 0 }; }
            players[image].count += 1;
          });
        });
      }
      const sorted = Object.entries(players)
        .map(([image, data]) => ({ image, count: data.count }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 10);
      return sorted;
    }

    function computePlayerStats() {
      const pieceStats = {};
      PIECES.forEach(p => { pieceStats[p.id] = { players: {} }; });

      for (const [key, state] of Object.entries(allGameData)) {
        if (!state) continue;
        if (!isGameComplete(state)) continue;
        const [stIdx, spIdx] = key.split('-').map(Number);
        const spiel = spielplan.spieltage[stIdx]?.[spIdx];
        if (!spiel) continue;
        const rows = ['top', 'bottom'];
        rows.forEach(row => {
          const side = row === 'top' ? 'white' : 'black';
          PIECES.forEach(piece => {
            const slot = `${row}-${piece.id}`;
            const image = state.figureImages?.[slot];
            if (!image) return;
            const points = state.results[side]?.[piece.id] ?? 0;
            const teamLogo = side === 'white' ? state.teamLogos?.white : state.teamLogos?.black;
            const teamName = side === 'white' ? spiel.heim : spiel.auswaerts;
            const playerData = pieceStats[piece.id].players;
            if (!playerData[image]) {
              playerData[image] = {
                games: 0,
                totalPoints: 0,
                maxPoints: -Infinity,
                maxGameTeam: null,
                maxGameTeamLogo: null,
                values: []
              };
            }
            const p = playerData[image];
            p.games += 1;
            p.totalPoints += points;
            p.values.push(points);
            if (points > p.maxPoints) {
              p.maxPoints = points;
              p.maxGameTeam = teamName;
              p.maxGameTeamLogo = teamLogo;
            }
          });
        });
      }

      const result = {};
      for (const [piece, data] of Object.entries(pieceStats)) {
        const players = data.players;
        const entries = Object.entries(players).map(([image, stats]) => ({
          image,
          games: stats.games,
          totalPoints: stats.totalPoints,
          maxPoints: stats.maxPoints,
          avg: stats.games > 0 ? stats.totalPoints / stats.games : 0,
          team: stats.maxGameTeam,
          teamLogo: stats.maxGameTeamLogo,
          values: stats.values || []
        }));
        const bySingle = [...entries]
          .sort((a, b) => b.maxPoints - a.maxPoints)
          .slice(0, 5);
        const byAvg = [...entries]
          .filter(e => e.games >= 3)
          .sort((a, b) => b.avg - a.avg)
          .slice(0, 5);
        result[piece] = { bySingle, byAvg };
      }
      return result;
    }

    function renderStatistics() {
      const container = document.getElementById('statsContainer');
      container.innerHTML = '';

      const appearanceData = computeAppearanceStats();
      const appearanceCard = document.createElement('div');
      appearanceCard.className = 'stat-card';
      const headApp = document.createElement('div');
      headApp.className = 'stat-card-head';
      headApp.innerHTML = `
          <div class="piece-icon-wrap" style="background:rgba(255,215,0,0.06);border-color:rgba(255,215,0,0.15);">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--bl-gold)" stroke-width="2" style="width:18px;height:18px;"><path d="M4 20V12"/><path d="M12 20V6"/><path d="M20 20V15"/></svg>
          </div>
          <h3>Häufigste Einsätze</h3>
        `;
      appearanceCard.appendChild(headApp);
      const sectionApp = document.createElement('div');
      sectionApp.className = 'stat-section';
      const listApp = document.createElement('div');
      if (appearanceData.length === 0) {
        listApp.innerHTML = '<div class="no-data">Keine Daten verfügbar</div>';
      } else {
        appearanceData.forEach((entry, idx) => {
          const rankClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
          const div = document.createElement('div');
          div.className =
            `stat-entry ${idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : ''}`;
          div.innerHTML = `
              <div class="rank-badge ${rankClass}">${idx + 1}</div>
              <div class="avatar-wrap">
                <img class="player-img" src="${entry.image}" alt="Spieler" onerror="this.style.display='none'" />
              </div>
              <div class="value-chip" style="margin-left:0;flex:1;align-items:flex-start;">
                <span class="value-num">${entry.count}</span>
                <span class="value-unit">Einsätze</span>
              </div>
            `;
          listApp.appendChild(div);
        });
      }
      sectionApp.appendChild(listApp);
      appearanceCard.appendChild(sectionApp);
      container.appendChild(appearanceCard);

      const stats = computePlayerStats();
      PIECES.forEach(p => {
        const card = document.createElement('div');
        card.className = 'stat-card';
        const head = document.createElement('div');
        head.className = 'stat-card-head';
        head.innerHTML = `
            <div class="piece-icon-wrap"><img src="${PIECE_SVG_URLS[p.id]}" alt="" /></div>
            <h3>${p.name}</h3>
          `;
        card.appendChild(head);

        const sectionSingle = document.createElement('div');
        sectionSingle.className = 'stat-section';
        sectionSingle.innerHTML = `<div class="section-title">Höchste Einzelpunktzahl</div>`;
        const listSingle = document.createElement('div');
        const singleData = stats[p.id]?.bySingle || [];
        if (singleData.length === 0) {
          listSingle.innerHTML = '<div class="no-data">Keine Daten verfügbar</div>';
        } else {
          singleData.forEach((entry, idx) => {
            const rankClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
            const div = document.createElement('div');
            div.className =
              `stat-entry ${idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : ''}`;
            div.innerHTML = `
                <div class="rank-badge ${rankClass}">${idx + 1}</div>
                <div class="avatar-wrap">
                  <img class="player-img" src="${entry.image}" alt="Spieler" onerror="this.style.display='none'" />
                  ${entry.teamLogo ? `<img class="team-badge-mini" src="${entry.teamLogo}" alt="" />` : ''}
                </div>
                <div class="meta-col">
                  <span class="meta-team">${entry.team || '?'}</span>
                  <span class="meta-detail">${entry.games} Einsätze · gesamt ${entry.totalPoints}</span>
                </div>
                <div class="value-chip">
                  <span class="value-num">${entry.maxPoints}</span>
                  <span class="value-unit">Punkte</span>
                </div>
              `;
            listSingle.appendChild(div);
          });
        }
        sectionSingle.appendChild(listSingle);
        card.appendChild(sectionSingle);

        const sectionAvg = document.createElement('div');
        sectionAvg.className = 'stat-section';
        sectionAvg.innerHTML = `<div class="section-title">Bester Durchschnitt (min. 3 Spiele)</div>`;
        const listAvg = document.createElement('div');
        const avgData = stats[p.id]?.byAvg || [];
        if (avgData.length === 0) {
          listAvg.innerHTML = '<div class="no-data">Nicht genug Einsätze (mindestens 3)</div>';
        } else {
          avgData.forEach((entry, idx) => {
            const rankClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
            const div = document.createElement('div');
            div.className =
              `stat-entry ${idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : ''}`;
            div.innerHTML = `
                <div class="rank-badge ${rankClass}">${idx + 1}</div>
                <div class="avatar-wrap">
                  <img class="player-img" src="${entry.image}" alt="Spieler" onerror="this.style.display='none'" />
                </div>
                <div class="meta-col">
                  <span class="meta-detail">${entry.games} Spiele · gesamt ${entry.totalPoints}</span>
                </div>
                <div class="value-chip">
                  <span class="value-num">${entry.avg.toFixed(1)}</span>
                  <span class="value-unit">Ø Punkte</span>
                </div>
              `;
            listAvg.appendChild(div);
          });
        }
        sectionAvg.appendChild(listAvg);
        card.appendChild(sectionAvg);
        container.appendChild(card);
      });
    }

    // ============================
    //  VIEW-NAVIGATION
    // ============================
    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.nav-links button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById(`${view}View`).classList.add('active');
      if (view === 'games') renderAllGames();
      if (view === 'stats') renderStatistics();
    }

    // ============================
    //  LADE ALLE DATEN
    // ============================
    async function loadAllGameData() {
      const gameData = {};
      const totalSpieltage = spielplan.spieltage.length;
      const stPromises = [];
      for (let stIdx = 0; stIdx < totalSpieltage; stIdx++) {
        const spiele = spielplan.spieltage[stIdx];
        const spieleCount = spiele.length;
        const spielPromises = [];
        for (let spIdx = 0; spIdx < spieleCount; spIdx++) {
          const filePath = `${DATA_BASE}Spieltag ${stIdx+1}/${spIdx+1}.json`;
          spielPromises.push(
            fetch(filePath)
            .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
            .then(data => ({ stIdx, spIdx, data }))
            .catch(() => null)
          );
        }
        stPromises.push(
          Promise.all(spielPromises).then(results => {
            const valid = results.filter(r => r !== null);
            for (const { stIdx, spIdx, data } of valid) {
              const state = data.data || data;
              if (!state) return;
              if (state.positions) {
                state.assignments = state.positions.map(p => ({
                  id: p.id,
                  side: p.side || null,
                  piece: p.piece || null,
                  polarity: p.polarity || null,
                  knightSwing: p.knightSwing ?? 1,
                }));
                delete state.positions;
              }
              if (!state.results) {
                state.results = { white: { rook: 0, bishop: 0, knight: 0, queen: 0, king: 0 }, black: { rook: 0,
                    bishop: 0, knight: 0, queen: 0, king: 0 } };
              }
              if (!state.theses) state.theses = Array.from({ length: 12 }, (_, i) => `These ${i+1}`);
              if (!state.teamLogos) state.teamLogos = { white: null, black: null };
              if (!state.figureImages) state.figureImages = {};
              gameData[`${stIdx}-${spIdx}`] = state;
            }
          })
        );
      }
      await Promise.all(stPromises);
      return gameData;
    }

    // ============================
    //  INIT
    // ============================
    async function init() {
      try {
        const res = await fetch(SPIELPLAN_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        spielplan = await res.json();
        teams = spielplan.teams;

        allGameData = await loadAllGameData();
        renderTables();

        let startIndex = 0;
        for (let i = spielplan.spieltage.length - 1; i >= 0; i--) {
          const spiele = spielplan.spieltage[i];
          const hasData = spiele.some((_, spIdx) => allGameData[`${i}-${spIdx}`]);
          if (hasData) { startIndex = i; break; }
        }
        if (spielplan.spieltage.length > 0) {
          renderMainSpiele(startIndex);
        }

        document.querySelectorAll('.nav-links button').forEach(btn => {
          btn.addEventListener('click', () => switchView(btn.dataset.view));
        });
      } catch (err) {
        console.error('Fehler beim Laden:', err);
        document.getElementById('spieleContainer').innerHTML =
          '<p style="color:var(--bl-red);font-family:var(--font-mono);">Spielplan konnte nicht geladen werden.</p>';
      }
    }

    init();
  </script>
