<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Bundesliga Tabellenrechner 2026/27</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>2. Bundesliga 2026/27</h1>
        <div id="adminPanel">
            <button id="adminToggle">🔐 Admin-Modus</button>
            <span id="adminStatus"></span>
        </div>
    </header>

    <main>
        <section id="controls">
            <label for="spieltagSelect">Spieltag:</label>
            <select id="spieltagSelect"></select>
            <button id="saveResults">💾 Ergebnisse speichern</button>
            <button id="exportBtn">📥 Export (JSON)</button>
            <button id="importBtn">📤 Import (JSON)</button>
            <input type="file" id="importFile" accept=".json" style="display:none">
        </section>

        <section id="spieleContainer">
            <h2>Spiele des Spieltags</h2>
            <div id="spieleListe"></div>
        </section>

        <section id="tabelleContainer">
            <h2>Tabelle</h2>
            <div id="tabelle"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
